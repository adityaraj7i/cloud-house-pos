name: Build Cloud House Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies & Sync Android
        run: |
          npm install
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Cloud-House-POS.apk

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-House-POS-APK
          path: build-output/Cloud-House-POS.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cloud House POS APK v1.0.${{ github.run_number }}
          body: |
            ### 📱 Cloud House POS Android APK
            Download and install `Cloud-House-POS.apk` directly on your Android phone to test the application!
            
            **Installation Steps:**
            1. Download `Cloud-House-POS.apk` attached below.
            2. Tap the downloaded file to install on your Android device (Allow unknown apps if prompted).
            3. Open **Cloud House POS** and enjoy testing!
          files: |
            build-output/Cloud-House-POS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}